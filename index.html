<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0d14;
      --surface: #111520;
      --border: #1e2536;
      --text: #e2e8f0;
      --muted: #64748b;
      --green: #22d3a5;
      --yellow: #f59e0b;
      --red: #f43f5e;
      --blue: #38bdf8;
      --accent: #7c6aff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; min-height: 100vh; }

    /* ---- HEADER ---- */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px; border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, #0a0d14 0%, #0f1322 100%);
    }
    .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .logo span { color: var(--green); }
    .status-badge {
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      padding: 4px 12px; border-radius: 20px; background: rgba(34,211,165,.12);
      color: var(--green); border: 1px solid rgba(34,211,165,.3);
    }
    .last-refresh { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

    /* ---- LAYOUT ---- */
    main { padding: 32px; max-width: 1400px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 32px; }

    /* ---- CARDS ---- */
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 24px; transition: border-color .2s;
    }
    .card:hover { border-color: var(--accent); }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .card-title { font-weight: 700; font-size: 15px; }
    .badge {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 3px 10px;
      border-radius: 12px; font-weight: 600; text-transform: uppercase;
    }
    .badge-healthy  { background: rgba(34,211,165,.15); color: var(--green); }
    .badge-degraded { background: rgba(245,158,11,.15);  color: var(--yellow); }
    .badge-unhealthy{ background: rgba(244, 63,94,.15);  color: var(--red); }
    .badge-unknown  { background: rgba(100,116,139,.15); color: var(--muted); }

    .stat-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .stat-label { font-size: 12px; color: var(--muted); }
    .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; }
    .stat-value.green  { color: var(--green); }
    .stat-value.yellow { color: var(--yellow); }
    .stat-value.red    { color: var(--red); }

    /* sparkline */
    .sparkline { margin-top: 16px; height: 36px; display: flex; align-items: flex-end; gap: 2px; }
    .spark-bar {
      flex: 1; border-radius: 2px; min-height: 4px;
      transition: opacity .2s;
    }
    .spark-healthy   { background: var(--green); }
    .spark-degraded  { background: var(--yellow); }
    .spark-unhealthy { background: var(--red); }

    /* ---- SYSTEM ---- */
    .system-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
    .sys-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .sys-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .05em; }
    .sys-value { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 600; }
    .progress { height: 4px; background: var(--border); border-radius: 4px; margin-top: 10px; }
    .progress-bar { height: 100%; border-radius: 4px; transition: width .5s; }

    /* ---- RECOVERY LOG ---- */
    .log-section h2 { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
    .log-table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
    .log-table th { text-align: left; padding: 8px 12px; color: var(--muted); border-bottom: 1px solid var(--border); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    .log-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .log-table tr:last-child td { border-bottom: none; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot-success { background: var(--green); }
    .dot-fail    { background: var(--red); }

    /* ---- EMPTY ---- */
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  </style>
</head>
<body>
  <header>
    <div class="logo">Health<span>Monitor</span></div>
    <span id="badge" class="status-badge pulse">Connecting…</span>
    <span id="last-refresh" class="last-refresh">—</span>
  </header>
  <main>
    <div class="system-row" id="system-row">
      <div class="sys-card"><div class="sys-title">CPU</div><div class="sys-value" id="cpu">—</div><div class="progress"><div class="progress-bar" id="cpu-bar" style="background:var(--blue)"></div></div></div>
      <div class="sys-card"><div class="sys-title">Memory</div><div class="sys-value" id="mem">—</div><div class="progress"><div class="progress-bar" id="mem-bar" style="background:var(--accent)"></div></div></div>
      <div class="sys-card"><div class="sys-title">Disk</div><div class="sys-value" id="disk">—</div><div class="progress"><div class="progress-bar" id="disk-bar" style="background:var(--yellow)"></div></div></div>
    </div>

    <div class="grid" id="targets-grid">
      <div class="empty pulse">Loading targets…</div>
    </div>

    <div class="log-section">
      <h2>Recovery History</h2>
      <table class="log-table">
        <thead><tr><th>Time</th><th>Target</th><th>Strategy</th><th>Result</th></tr></thead>
        <tbody id="recovery-body"><tr><td colspan="4" class="empty">No recovery attempts yet.</td></tr></tbody>
      </table>
    </div>
  </main>

  <script>
    const fmt = (ms) => ms < 1000 ? `${ms}ms` : `${(ms/1000).toFixed(1)}s`;
    const pct = (n) => `${n}%`;
    const ts  = (iso) => new Date(iso).toLocaleTimeString();

    async function fetchJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${r.status}`);
      return r.json();
    }

    function badgeClass(status) {
      return { healthy: 'badge-healthy', degraded: 'badge-degraded', unhealthy: 'badge-unhealthy' }[status] || 'badge-unknown';
    }
    function sparkClass(status) {
      return { healthy: 'spark-healthy', degraded: 'spark-degraded', unhealthy: 'spark-unhealthy' }[status] || 'spark-unhealthy';
    }
    function rtColor(ms) {
      return ms < 500 ? 'green' : ms < 2000 ? 'yellow' : 'red';
    }

    async function refresh() {
      try {
        const [statusData, metricsData, recoveryData] = await Promise.all([
          fetchJSON('/api/status'),
          fetchJSON('/api/metrics'),
          fetchJSON('/api/recovery'),
        ]);

        // System metrics
        const sys = metricsData.system || {};
        if (sys.cpu_percent !== undefined) {
          document.getElementById('cpu').textContent = pct(sys.cpu_percent);
          document.getElementById('cpu-bar').style.width = pct(sys.cpu_percent);
          document.getElementById('mem').textContent = pct(sys.memory?.percent ?? 0);
          document.getElementById('mem-bar').style.width = pct(sys.memory?.percent ?? 0);
          document.getElementById('disk').textContent = pct(sys.disk?.percent ?? 0);
          document.getElementById('disk-bar').style.width = pct(sys.disk?.percent ?? 0);
        }

        // Target cards
        const targets = statusData.targets || {};
        const metricsMap = {};
        for (const t of metricsData.targets || []) metricsMap[t.name] = t;

        const grid = document.getElementById('targets-grid');
        if (!Object.keys(targets).length) {
          grid.innerHTML = '<div class="empty">No targets configured.</div>';
        } else {
          grid.innerHTML = '';
          for (const [name, info] of Object.entries(targets)) {
            const m = metricsMap[name] || {};
            const history = (m.last_100 || []).slice(-40);
            const maxRT = Math.max(...history.map(h => h.response_time_ms || 0), 1);

            const sparks = history.map(h => {
              const h_pct = Math.max(10, Math.round((h.response_time_ms || 0) / maxRT * 100));
              return `<div class="spark-bar ${sparkClass(h.status)}" style="height:${h_pct}%" title="${h.status} — ${h.response_time_ms}ms @ ${ts(h.ts)}"></div>`;
            }).join('');

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <div class="card-header">
                <span class="card-title">${name}</span>
                <span class="badge ${badgeClass(info.status)}">${info.status || 'unknown'}</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Response Time</span>
                <span class="stat-value ${rtColor(info.response_time_ms)}">${fmt(info.response_time_ms)}</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Availability</span>
                <span class="stat-value green">${m.availability_pct ?? '—'}%</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">HTTP Status</span>
                <span class="stat-value">${info.status_code || 'N/A'}</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Failures (consec.)</span>
                <span class="stat-value ${info.consecutive_failures > 0 ? 'red' : 'green'}">${info.consecutive_failures}</span>
              </div>
              ${info.error ? `<div class="stat-row"><span class="stat-label" style="color:var(--red)">${info.error}</span></div>` : ''}
              <div class="sparkline">${sparks || '<span class="stat-label">No data yet</span>'}</div>
            `;
            grid.appendChild(card);
          }
        }

        // Recovery history
        const history = recoveryData.history || [];
        const tbody = document.getElementById('recovery-body');
        if (!history.length) {
          tbody.innerHTML = '<tr><td colspan="4" class="empty">No recovery attempts yet.</td></tr>';
        } else {
          tbody.innerHTML = history.slice().reverse().map(r => `
            <tr>
              <td>${new Date(r.ts * 1000).toLocaleString()}</td>
              <td>${r.target}</td>
              <td>${r.strategy}</td>
              <td><span class="dot ${r.success ? 'dot-success' : 'dot-fail'}"></span>${r.success ? 'Success' : 'Failed'}</td>
            </tr>
          `).join('');
        }

        // Header badge
        const allStatuses = Object.values(targets).map(t => t.status);
        const overallOk = allStatuses.every(s => s === 'healthy');
        const anyDown  = allStatuses.some(s => s === 'unhealthy');
        const badge = document.getElementById('badge');
        badge.className = 'status-badge';
        badge.textContent = overallOk ? '● All Systems Operational' : anyDown ? '● Incident Detected' : '● Degraded Performance';
        if (!overallOk) badge.style.background = anyDown ? 'rgba(244,63,94,.12)' : 'rgba(245,158,11,.12)';
        if (!overallOk) badge.style.color = anyDown ? 'var(--red)' : 'var(--yellow)';
        if (!overallOk) badge.style.borderColor = anyDown ? 'rgba(244,63,94,.3)' : 'rgba(245,158,11,.3)';

        document.getElementById('last-refresh').textContent = 'Updated ' + new Date().toLocaleTimeString();
      } catch (e) {
        document.getElementById('badge').textContent = '⚠ Connection Error';
        console.error(e);
      }
    }

    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
